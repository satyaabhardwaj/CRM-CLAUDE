name: magppie-staging
services:
  crm:
    image: ${CRM_IMAGE:?Set the tested immutable image tag or digest}
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set the staging application database URL}
      CRM_ORIGIN: ${CRM_ORIGIN:?Set the exact HTTPS staging origin}
      CRM_UPLOADS_DIR: /var/lib/crm/uploads
    volumes:
      - uploads:/var/lib/crm/uploads
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -m, backend.healthcheck]
      interval: 30s
      timeout: 10s
      retries: 3
    expose: ["8000"]
  proxy:
    image: caddy:2-alpine
    environment:
      CRM_HOST: ${CRM_HOST:?Set the staging hostname}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      crm:
        condition: service_healthy
volumes:
  uploads:
  caddy_data:
  caddy_config:
