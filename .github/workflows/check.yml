name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix backend/react
      - run: npm ci --prefix measurement/react
      - run: npm run format:check --prefix measurement/react
      - run: npm test --prefix measurement/react
      - run: npm run build --prefix measurement/react
      - run: npm ci --prefix accounts/react
      - run: npm run format:check --prefix accounts/react
      - run: npm test --prefix accounts/react
      - run: npm run build --prefix accounts/react
      - run: npm ci --prefix sales/react
      - run: npm run format:check --prefix sales/react
      - run: npm test --prefix sales/react
      - run: npm run build --prefix sales/react
      - run: npm ci --prefix design/react
      - run: npm run format:check --prefix design/react
      - run: npm test --prefix design/react
      - run: npm run build --prefix design/react
      - run: npm ci --prefix management/react
      - run: npm run format:check --prefix management/react
      - run: npm test --prefix management/react
      - run: npm run build --prefix management/react
      - run: npm run format:check --prefix backend/react
      - run: npm test --prefix backend/react
      - run: npm run build --prefix backend/react
      - run: python -B scripts/check.py
      - run: python -B scripts/build.py

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: crm_test
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: crm_crud_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm_test -d crm_crud_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://crm_test:synthetic_ci_only@127.0.0.1:5432/crm_crud_test_ci
      TEST_DATABASE_URL: postgresql+psycopg://crm_test:synthetic_ci_only@127.0.0.1:5432/crm_crud_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-backend.txt
      - run: python -m pip check
      - run: python -m alembic upgrade head
      - run: python -m pytest backend/tests -q
