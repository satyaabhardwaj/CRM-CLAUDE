name: Staging container checks
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: crm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-backend.txt
      - run: python -m pytest backend/tests -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:synthetic-ci-only@localhost:5432/crm_test
      - run: docker build -t magppie-crm:checked .
      - run: docker compose config --quiet
        env:
          CRM_ENV_FILE: deploy/container.env.example
